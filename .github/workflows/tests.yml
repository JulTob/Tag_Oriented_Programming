name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-checkout:
    name: Windows checkout
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.3", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: The suite
        run: |
          PYTHONPATH=. python - <<'PY'
          import unittest

          original_failure = unittest.result.TestResult.addFailure
          original_error = unittest.result.TestResult.addError

          def report(kind, test, err):
              name = test.id().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=unittest {kind}::{name} ({err[0].__name__})', flush=True)

          def add_failure(self, test, err):
              report('failure', test, err)
              return original_failure(self, test, err)

          def add_error(self, test, err):
              report('error', test, err)
              return original_error(self, test, err)

          unittest.result.TestResult.addFailure = add_failure
          unittest.result.TestResult.addError = add_error
          unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-t', '.'])
          PY

  performance-observation:
    name: Performance ratios (observation only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Measure Tagging and Rip ratios
        run: PYTHONPATH=. python -m benchmarks.ci_ratios > ratios.txt 2>&1
      - name: Show ratios in the job summary
        if: always()
        run: |
          {
            echo '## Performance ratios (observation only)'
            echo 'Shared-runner timing varies; these ratios never gate a merge.'
            echo '```text'
            if [ -f ratios.txt ]; then cat ratios.txt; else echo 'Measurement did not start.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
