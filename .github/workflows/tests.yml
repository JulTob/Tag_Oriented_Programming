name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-checkout:
    name: Windows checkout
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  test:
    name: Standard suite ${{ matrix.mode }} on Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, quiet, buffer, verbose]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: The suite
        run: |
          case "${{ matrix.mode }}" in
            plain) PYTHONPATH=. python -m unittest discover -s tests -t . > /dev/null 2>&1 ;;
            quiet) PYTHONPATH=. python -m unittest discover -s tests -t . -q > /dev/null 2>&1 ;;
            buffer) PYTHONPATH=. python -m unittest discover -s tests -t . -b > /dev/null 2>&1 ;;
            verbose) PYTHONPATH=. python -m unittest discover -s tests -t . -v > /dev/null 2>&1 ;;
          esac

  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
