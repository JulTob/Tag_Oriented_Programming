# Publishes TopKit to PyPI when the Director publishes a GitHub Release.
#
# PyPI trusts this file through Trusted Publishing, so there is no token
# anywhere: GitHub proves to PyPI, for one run, that the upload comes from
# this workflow in this repository. The publish job runs in the `pypi`
# environment, which waits for the Director's approval. The steps are in
# RELEASING.md.

name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: The suite
        run: PYTHONPATH=. python -m unittest discover -s tests -t .
      - name: The oracle at its audited size
        run: PYTHONPATH=. python tests/oracle_topkit.py --seeds 50 --steps 1200 --population 18

  build:
    name: Build and check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: The release tag names the version, and the changelog has it
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is $TAG, but pyproject.toml says $version: tag the release v$version."
            exit 1
          fi
          heading=$(grep -m 1 "^## $version " CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no heading for $version."
            exit 1
          fi
          case "$heading" in
            *unreleased*)
              echo "::error::CHANGELOG.md still marks $version unreleased."
              exit 1
              ;;
          esac
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/topkit/
    permissions:
      id-token: write   # Trusted Publishing: the one permission PyPI needs
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
